<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>tncode · 機能台帳</title>
<style>:root{color-scheme:light dark;font:15px/1.6 system-ui,sans-serif}body{max-width:1360px;margin:auto;padding:24px}header{display:flex;align-items:baseline;justify-content:space-between;flex-wrap:wrap;gap:10px}h1{font-size:1.55rem;margin:0}h2{font-size:1.1rem}nav a{margin-right:12px}form{display:flex;flex-wrap:wrap;gap:7px;margin-top:18px}input,button,select{font:inherit;padding:5px 10px}input{flex:1;min-width:230px}main{display:grid;grid-template-columns:minmax(240px,32%) 1fr;gap:22px}ul{padding-left:1.4em}#rows{padding:0;list-style:none}#rows button{width:100%;text-align:left;border:0;border-bottom:1px solid #88958d70;cursor:pointer}#rows button[aria-current=true]{font-weight:700;border-left:4px solid #408866}article{overflow-wrap:anywhere}dt{font-weight:650}dd{margin:0 0 8px}details{margin-top:12px}p{margin:8px 0}a+a{margin-left:8px}@media(max-width:740px){main{display:block}#rows{max-height:208px;overflow:auto}} </style>
<header><h1>T3 Code 0.1.12 の移植台帳</h1><nav><a href="screens/README.md">画面仕様</a><a href="screens/layout.html">配置図</a><a href="comparison/README.md">Swift 差分</a></nav></header><form onsubmit="return false"><input id="query" placeholder="機能名・コマンド・ID・ファイル名" aria-label="検索"><select id="domain" aria-label="領域"></select><select id="status" aria-label="Swift の対応"></select></form><p id="count" aria-live="polite"></p><main><section><ul id="rows"></ul><button id="prev">前へ</button> <button id="next">次へ</button></section><article id="detail"></article></main>
<script id="data" type="application/json">__PUBLIC_DATA__</script><script>
'use strict';
const byId=id=>document.getElementById(id),db=JSON.parse(byId('data').textContent);
const records=new Map(db.features.map(v=>[v[0],Object.fromEntries(db.columns.map((k,i)=>[k,v[i]]))]));
for(const r of db.runtime)records.set(r.id,{...r,title:r.id==='RT-TERMINAL-INPUT'?'端末への文字入力':'端末フォントの試写',swift_status:r.status,swift_acceptance:r.acceptance});
const entrances=new Map(),instances=new Map(),observations=new Map(),index=new Map(),owners=new Map();
function put(map,k,v){if(!map.has(k))map.set(k,[]);map.get(k).push(v)}
for(const e of db.entries){put(entrances,e[1],e);owners.set(e[0],e[1]);}
for(const e of db.live){put(instances,e[1],e);owners.set(e[0],e[1]);}
for(const o of db.results)put(observations,o.feature_id,o);
for(const [id,r] of records)index.set(id,[id,r.title,r.source,r.action,...(entrances.get(id)||[]).flatMap(e=>[e[0],e[3]]),...(instances.get(id)||[]).map(e=>e[0])].join(' ').toLowerCase());
function element(tag,text,parent){const e=document.createElement(tag);if(text!=null)e.textContent=text;if(parent)parent.append(e);return e}
function link(parent,label,href){const e=element('a',label,parent);e.href=href;return e}
function choices(id,label,items){const s=byId(id);for(const [v,n] of [['',label],...items.map(i=>[i,i])])element('option',n,s).value=v}
choices('domain','全領域',[...new Set([...records.keys()].map(id=>id.split('-')[0]))]);
choices('status','Swift の対応',[...new Set([...records.values()].map(r=>r.swift_status))]);
const ref='https://github.com/pingdotgg/t3code/blob/ca81b7b97a1c4b91e5ac25768d0f6629f37732fd/';
function pointers(parent,value,native=false){for(const p of (value||'').split('|')){const m=p.trim().match(/^(.+?):L?(\d+)(?:[-–]L?(\d+))?$/);if(m)link(parent,m[1].split('/').pop()+':'+m[2],(native?'../PiWorkspace/':ref)+m[1].split('/').map(encodeURIComponent).join('/')+'#L'+m[2]);}}
let page=0,selected='',filtered=[];
function display(id){const panel=byId('detail');panel.replaceChildren();if(!id)return;const r=records.get(id);element('h2',id+'　'+r.title,panel);const dl=element('dl',null,panel);
for(const [k,n] of [['preconditions','前提'],['entry','入口'],['action','操作'],['intermediate','途中'],['success','完了'],['recovery','失敗・復帰'],['effects','保存・作用'],['t3_verification','原本の確認範囲'],['gate','再現条件'],['acceptance','原本の判定'],['swift_status','Swift の対応'],['difference','差分'],['swift_acceptance','Swift の受入条件']]){if(r[k]){element('dt',n,dl);element('dd',r[k],dl);}}
pointers(element('p',null,panel),r.source);pointers(element('p',null,panel),r.swift_source,true);
for(const o of observations.get(id)||[]){element('p',o.outcome,panel);element('small',o.remaining,panel);}
const items=entrances.get(id)||[],observed=instances.get(id)||[];
const detail=element('details',null,panel);element('summary','入口宣言 '+items.length+'件・実機入口 '+observed.length+'件',detail);
for(const [eid,,kind,name,source] of items){const n=element('p',eid+' '+name+' ('+kind+') ',detail);pointers(n,source);}
for(const [eid,,screen,role] of observed)element('p',eid+'　'+screen+'　'+role,detail);
}
function refresh(reset){if(reset)page=0;const terms=byId('query').value.toLowerCase().trim().split(/\s+/).filter(Boolean);
filtered=[...records.values()].filter(r=>(!byId('domain').value||r.id.split('-')[0]===byId('domain').value)&&(!byId('status').value||r.swift_status===byId('status').value)&&terms.every(t=>index.get(r.id).includes(t))).map(r=>r.id);
page=Math.max(0,Math.min(page,Math.ceil(filtered.length/18)-1));const slice=filtered.slice(page*18,page*18+18);if(!slice.includes(selected))selected=slice[0]||'';
byId('count').textContent=filtered.length+' 件'+(slice.length?' ・ '+(page*18+1)+'–'+(page*18+slice.length):'');const rows=byId('rows');rows.replaceChildren();for(const id of slice){const b=element('button',id+'　'+records.get(id).title,element('li',null,rows));b.setAttribute('aria-current',id===selected);b.onclick=()=>{selected=id;history.replaceState(null,'','#'+id);refresh(false)};}
byId('prev').disabled=page===0;byId('next').disabled=(page+1)*18>=filtered.length;display(selected);}
for(const f of ['query','domain','status'])byId(f).addEventListener('input',()=>refresh(true));byId('prev').onclick=()=>{page--;refresh(false)};byId('next').onclick=()=>{page++;refresh(false)};
const deep=decodeURIComponent(location.hash.slice(1));if(owners.has(deep)||records.has(deep))byId('query').value=owners.get(deep)||deep;refresh(true);
</script></html>
